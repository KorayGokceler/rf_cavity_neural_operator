# ═══════════════════════════════════════════════════
#  ABLATION D: Tüm 6 feature + RFF açık (MEVCUT VARSAYILAN)
#  Feature indices: null (tümü)
#  use_rff: true
#  Soru: Mevcut full pipeline ne kadar başarılı? (referans)
# ═══════════════════════════════════════════════════

data_convert:
  h5_filepath: "rf_cavity_1000_dataset.h5"
  output_path: "data/gnot_dataset.pkl"
  output_format: "pkl"
  mode_indices: [1]
  max_samples: null

dataset:
  data_path: "data/gnot_dataset.pkl"
  train_ratio: 0.8
  val_ratio: 0.1
  random_seed: 42
  # feature_indices yok → tüm 6 feature kullanılır

model:
  val_dim: 8                      # Tüm 8 feature
  grid_dim: 2
  theta_dim: 1
  embed_dim: 256
  n_shared_layers: 2
  n_mode_layers: 2
  n_freq_layers: 2
  n_heads: 4
  num_experts: 4
  num_field_modes: 1
  num_film_modes: 20
  film_init_std: 0.02
  rff_dim: 64
  rff_scale: 1.0
  use_rff: true                   # RFF AÇIK ✅
  dropout: 0.0
  use_checkpoint: false

training:
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4
  batch_size: 64
  max_epochs: 1000
  gradient_clip_val: 1.0
  strategy: "auto"
  freq_weight: 0.5
  mode_loss_weights: [1.0]
  scheduler: "onecycle"
  onecycle_pct_start: 0.15
  onecycle_div_factor: 25
  onecycle_final_div_factor: 1.0e+4
  cosine_eta_min: 1.0e-6
  patience: 200
  num_workers: 4
  pin_memory: true
  log_dir: "training_logs"
  exp_name: "ablation_D_full_with_rff"
  log_every_n_steps: 20
  viz_every_n_epochs: 10
  progress_bar_refresh_rate: 20
  fast_dev_run: false
