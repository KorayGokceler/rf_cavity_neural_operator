# ═══════════════════════════════════════════════════════════════
#  RF Cavity Neural Operator — Default Configuration
# ═══════════════════════════════════════════════════════════════
# Bu dosyayı kopyalayıp experiment-specific config oluşturabilirsiniz:
#   cp configs/default.yaml configs/experiment_v2.yaml
#   python train.py --config configs/experiment_v2.yaml
# ═══════════════════════════════════════════════════════════════

# ─────────────────────────────────────────────────────
#  1. DATA GENERATION (dataset_generator.py)
# ─────────────────────────────────────────────────────
data_gen:
  h5_filename: "rf_cavity_1000_dataset.h5"
  plot_dir: "dataset_plots"
  n_total: 1000                 # Üretilecek toplam geometri
  n_plot: 100                   # Görselleştirilecek örnek sayısı
  generation_mode: "random"     # "random" veya "calibration"
  
  # FEM Solver
  fem_order: "P2"               # Finite element order
  n_eigen_modes: 3              # Çözülecek eigenmode sayısı (k)
  eigen_sigma: 500.0            # Shift-invert sigma
  
  # Mesh control
  mesh_size_min: 0.0012         # Sınır yakınında minimum mesh boyutu
  mesh_size_max: 0.005          # Merkezde maximum mesh boyutu
  mesh_dist_min: 0.002          # Mesh sıklaştırma başlangıç mesafesi
  mesh_dist_max: 0.03           # Mesh sıklaştırma bitiş mesafesi

  # Geometry randomization
  sharp_n_pts_range: [7, 13]    # Sharp geometrilerde köşe sayısı aralığı
  sharp_r_range: [0.02, 0.046]  # Sharp geometrilerde yarıçap aralığı
  smooth_base_r: 0.035          # Smooth geometrilerde baz yarıçap
  smooth_perturb: 0.008         # Smooth geometrilerde pertürbasyon genliği
  smooth_harmonics: [2, 8]      # Smooth geometrilerde harmonik aralığı


# ─────────────────────────────────────────────────────
#  2. DATA CONVERSION (dataset_converter.py, convert.py)
# ─────────────────────────────────────────────────────
data_convert:
  h5_filepath: "rf_cavity_1000_dataset.h5"
  output_path: "data/gnot_dataset.pkl"
  output_format: "pkl"          # "pkl" veya "h5"
  mode_indices: [0, 1, 2]       # TUM 3 MODE (Monopol, Dipol, vs.)
  max_samples: null             # null = tümü


# ─────────────────────────────────────────────────────
#  3. DATASET (dataset.py)
# ─────────────────────────────────────────────────────
dataset:
  data_path: "data/gnot_dataset.pkl"
  train_ratio: 0.8
  val_ratio: 0.1
  # test_ratio otomatik: 1 - train - val = 0.1
  random_seed: 42
  max_nodes: 2048               # VRAM taşmasını önlemek için node sub-sampling (null=devre dışı)


# ─────────────────────────────────────────────────────
#  4. MODEL ARCHITECTURE (gnot.py)
# ─────────────────────────────────────────────────────
model:
  # Input dimensions (veri formatına bağlı)
  val_dim: 8                    # [x, y, dist_bnd, dir_bnd_x, dir_bnd_y, node_area, cos_principal, sin_principal]
  grid_dim: 2                   # Koordinat boyutu (2D)
  theta_dim: 1                  # Mode index boyutu

  # Core architecture
  embed_dim: 256                # Hidden dimension (ana boyut parametresi)
  n_shared_layers: 6            # Geometrik trunk derinliği (daha derin → daha iyi öğrenme)
  n_mode_layers: 1              # Her modun kendi fizik branch derinliği
  n_heads: 8                    # Attention head sayısı (256 / 8 = 32 dim per head)
  num_experts: 4                # GeometricGatingFFN expert sayısı
  predict_frequency: true       # Frekans tahmini aktif — her mode branch kendi frekansını tahmin eder

  # Mode conditioning
  num_field_modes: 3            # 3 mode da egitilecek
  num_film_modes: 20            # FiLM embedding tablo boyutu (headroom)
  film_init_std: 0.02           # FiLM embedding başlangıç std

  # Spatial encoding
  rff_dim: 64                   # Random Fourier Features boyutu (çift sayı olmalı)
  rff_scale: 1.0                # RFF frekans ölçeği

  # Regularization
  dropout: 0.0                  # Attention ve FFN dropout (0.0-0.3)

  # Memory optimization
  use_checkpoint: true          # Gradient checkpointing (GPU VRAM tasarrufu)


# ─────────────────────────────────────────────────────
#  5. TRAINING (lightning_module.py, train.py)
# ─────────────────────────────────────────────────────
training:
  # Optimization
  learning_rate: 2.0e-4
  weight_decay: 0.0               # Modelin genlikleri (amplutidleri) baskılamasını engelle
  batch_size: 16
  max_epochs: 500
  check_val_every_n_epoch: 1    # Her epoch sonunda doğrulama yap
  gradient_clip_val: 2.0        # Keskin gradyanlara (Peak fixleri) izin ver
  strategy: "auto"              # "auto" (single GPU) veya "ddp" (multi-GPU)

  # Loss
  freq_weight: 0.5              # Frekans loss ağırlığı: total = field + freq_w*freq + bnd + smooth
  smoothness_weight: 0.1        # Mesh-aware gradient matching loss ağırlığı (gürültüyü azaltır)
  mode_loss_weights: [1.0, 1.0, 1.0] # 3 MODE ICIN AGIRLIKLAR

  # LR Scheduler
  lr_mode_specific: [2.0e-4, 8.0e-5, 8.0e-5]  # [Mode 0, Mode 1, Mode 2] için özel fizik branch öğrenme hızları
  lr_freq_heads: 1.0e-4                     # Sadece frekans head'leri için özel LR

  scheduler: "reducelr"         # "reducelr" — Val loss takıldığında LR düşür
  reducelr_patience: 10         # Validation loss kaç epoch iyileşmezse LR düşsün
  reducelr_factor: 0.5          # LR'ın düşürülme katsayısı (yeni_lr = lr * factor)
  # OneCycleLR parametreleri (scheduler: "onecycle" yapılırsa kullanılır)
  onecycle_pct_start: 0.3
  onecycle_div_factor: 25
  onecycle_final_div_factor: 1.0e+4
  # CosineAnnealingLR parametreleri (scheduler: "cosine" yapılırsa kullanılır)
  cosine_eta_min: 1.0e-6

  # Early stopping
  patience: 25                  # Val loss iyileşmezse dur

  # DataLoader
  num_workers: 4                # Colab'da 4, Windows'ta 0 yapın
  pin_memory: true

  # Logging & Visualization
  log_dir: "training_logs"
  exp_name: "gnot_old_data_v1"
  log_every_n_steps: 10
  viz_every_n_epochs: 10        # Field görselleştirme sıklığı
  progress_bar_refresh_rate: 1

  # Debug
  fast_dev_run: false           # true ile 1 iterasyon test


# ─────────────────────────────────────────────────────
#  6. INFERENCE (infer.py)
# ─────────────────────────────────────────────────────
inference:
  checkpoint_path: null         # null = en son best checkpoint
  output_dir: "inference_results"
  num_visualize: 5
