# GNOT Configuration for Physics Mode 2 (Index 1) ONLY
dataset:
  data_path: "data/gnot_mode1_dataset.pkl"
  train_ratio: 0.8
  val_ratio: 0.1
  max_nodes: 2048        # VRAM safety
  feature_indices: null  # Use all 8 geometric features

model:
  embed_dim: 128         # Standard dimension
  n_shared_layers: 2
  n_mode_layers: 2
  n_freq_layers: 2
  n_heads: 4
  num_experts: 4
  num_field_modes: 1     # We only care about 1 mode (index 1 is treated as index 0 here)
  val_dim: 8             
  grid_dim: 2
  theta_dim: 1
  use_checkpoint: true
  use_rff: true
  rff_scale: 1.0

training:
  learning_rate: 0.0002
  batch_size: 32
  max_epochs: 300
  scheduler: "reducelr"
  weight_decay: 0.0001
  num_workers: 4         # Adjust based on local CPU
  pin_memory: true
  freq_weight: 0.5
  mode_loss_weights: [1.0]
  gradient_clip_val: 1.0
  fast_dev_run: false
  log_dir: "lightning_logs"
  exp_name: "gnot_mode2_only"
  log_every_n_steps: 10
  viz_every_n_epochs: 10
  patience: 30
