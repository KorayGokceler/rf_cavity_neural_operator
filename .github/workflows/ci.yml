name: CI

on:
  push:
    branches: [main, "claude/**", "codex/**", "copilot/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: System libraries for gmsh
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libglu1-mesa libxrender1 libxcursor1 libxft2 libxinerama1

      - name: Install Python dependencies (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          # CPU wheel (~200 MB) instead of the default CUDA build from PyPI (~2.5 GB).
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
          pip install ruff vulture

      - name: Lint (syntax errors / undefined names / unused imports)
        run: ruff check .

      - name: Dead Code Check (Vulture - Zero Bloat)
        run: vulture src/ scripts/ train.py convert_3d.py --min-confidence 90

      - name: CLI smoke (--help of every entry point)
        run: |
          for f in train.py convert_3d.py src/data_gen/dataset_generator_3d.py scripts/eval_3d.py \
                   scripts/eval_qoi.py scripts/plot_3d.py scripts/predict_geometry.py scripts/active_sampling.py \
                   scripts/resolution_study.py scripts/qoi_validation.py scripts/dataset_stats_3d.py \
                   scripts/show_geometries.py scripts/serve_web.py scripts/colab_webui.py; do
            if [ -f "$f" ]; then
              echo "::group::$f --help"
              python "$f" --help
              echo "::endgroup::"
            fi
          done

      - name: Unit tests
        run: python -m pytest -q
