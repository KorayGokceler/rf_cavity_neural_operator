name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: System libraries for gmsh
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libglu1-mesa libxrender1 libxcursor1 libxft2 libxinerama1

      - name: Install Python dependencies (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          # CPU wheel (~200 MB) instead of the default CUDA build from PyPI (~2.5 GB).
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      - name: Lint (syntax errors / undefined names)
        run: ruff check .

      - name: CLI smoke (--help of every entry point)
        run: |
          for f in train.py infer.py convert.py run_pipeline.py validate_data.py \
                   visualize_features.py plot_splits.py analyze_freq_separation.py \
                   src/data_gen/dataset_generator.py \
                   scripts/infer_val_all.py scripts/analyze_val_errors.py scripts/diagnose_data_floor.py; do
            echo "::group::$f --help"
            python "$f" --help
            echo "::endgroup::"
          done

      - name: Unit tests
        run: python -m pytest -q
