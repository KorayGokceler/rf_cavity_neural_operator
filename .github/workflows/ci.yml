name: CI

on:
  push:
    branches: [main, "claude/**", "codex/**", "copilot/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-web.txt

      - name: System libraries for gmsh
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libglu1-mesa libxrender1 libxcursor1 libxft2 libxinerama1

      - name: Install Python dependencies (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          # CPU wheel (~200 MB) instead of the default CUDA build from PyPI (~2.5 GB).
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt -r requirements-web.txt

      - name: Lint (syntax errors / undefined names / unused imports)
        run: ruff check .

      - name: Dead code (vulture, settings in pyproject.toml)
        run: vulture

      - name: CLI smoke (--help of every entry point)
        run: |
          for f in train.py src/data_gen/dataset_generator_3d.py scripts/predict_geometry.py \
                   scripts/dataset_stats_3d.py scripts/show_geometries.py scripts/serve_web.py \
                   scripts/colab_webui.py; do
            # a removed entry point must fail here: update this list in the same change
            [ -f "$f" ] || { echo "::error::$f is listed but does not exist"; exit 1; }
            echo "::group::$f --help"
            python "$f" --help
            echo "::endgroup::"
          done

      - name: Tests (unit, numerical and web-service integration)
        run: python -m pytest -q

      - name: Analytic check of the label solver (pillbox, must print PASS)
        run: python scripts/validate_field_labels.py --max_ndof 300000

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web UI build (tsc + vite)
        run: |
          cd web
          npm ci --no-audit --no-fund
          npm run build
